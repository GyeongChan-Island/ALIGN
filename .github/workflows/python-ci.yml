name: Python demo CI

on:
  push:
    branches: [main]
    paths:
      - "python/ALIGN_live_demo/**"
      - "data/hand_tilt_practice_01/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "python/ALIGN_live_demo/**"
      - "data/hand_tilt_practice_01/**"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit and mock serial tests
        run: python -m unittest discover -s python/ALIGN_live_demo/tests -v
      - name: Reproduce hand-tilt training
        run: >-
          python python/ALIGN_live_demo/train_model.py
          --data data/hand_tilt_practice_01 --kind hand --split session
          --out "$RUNNER_TEMP/align-hand-model"
